# Reject secret-file and dotfile scanner probes before they reach the app.
# Dokku includes this file inside each server block for the app.
# Keep the pattern in sync with _PROBE_PATH_PATTERN in config/security.py.
location ~* "(?:^|/)(?:\.(?!well-known(?:/|$))[^/]+|[^/]*\.php[^/]*|master\.key|credentials\.ya?ml(?:\.enc)?|secrets\.ya?ml)(?:/|$)" {
    access_log off;
    return 404;
}
